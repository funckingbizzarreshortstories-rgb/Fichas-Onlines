<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas de RPG Online</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f0f11;--card:#1b1b1f;--card2:#25252b;--line:#33333b;--tx:#ececf1;--mut:#9a9aa6;--acc:#a855f7;--vida:#a3141b;--san:#9333ea;--foco:#f59e0b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f1f5;--card:#fff;--card2:#ececf2;--line:#d4d4de;--tx:#18181c;--mut:#5f5f6b}}
:root[data-theme="dark"]{--bg:#0f0f11;--card:#1b1b1f;--card2:#25252b;--line:#33333b;--tx:#ececf1;--mut:#9a9aa6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Roboto,system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 10px}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:20px;max-width:1200px;margin:auto}
.login{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:24px;display:grid;gap:12px}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
input[type=number]{padding:7px 4px;text-align:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kp button{padding:12px;font-size:16px}
.err{color:#ef5350;font-size:12px;min-height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:56px;height:56px;border-radius:6px;background:var(--card2);border:1px solid var(--acc);display:grid;place-items:center;font-size:24px;color:var(--acc);flex:none}
.nm{font-weight:600;font-size:15px}.sub{color:var(--mut);font-size:12px}
.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:center;margin-top:8px}
.bar{position:relative;height:18px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.bar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px;color:#fff}
.st{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin-top:12px;gap:2px}
.st b{display:block;font-size:14px}.st small{color:var(--mut);font-size:10px;text-transform:uppercase}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.row{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;margin:6px 0}
.row.t{grid-template-columns:100px 1fr}
.row2{display:grid;grid-template-columns:1fr 60px 60px;gap:6px;align-items:center;margin:6px 0}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gh h2{margin:0}.gh input{width:60px;font-weight:700;color:var(--acc)}
.inv{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:center;margin:6px 0}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.sh{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:16px;align-items:start}.col{display:grid;gap:16px}
@media(max-width:820px){.sh{grid-template-columns:1fr}}
.rad{width:100%;max-width:420px;display:block;margin:auto}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.bx{text-align:center}.bx small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:3px}
.ah{display:flex;justify-content:space-between;background:var(--card2);border-left:3px solid var(--acc);padding:5px 10px;margin:14px 0 4px;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.06em}.ah span+span{color:var(--acc)}
.sk{display:grid;grid-template-columns:1fr 40px 64px;gap:8px;align-items:center;padding:3px 4px;border-bottom:1px solid var(--line)}.sk em{font-style:normal;font-size:11px;color:var(--mut)}
.av{overflow:hidden;cursor:pointer}
.dice{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.dice button{padding:5px 10px}
.rl{background:var(--card2);border-left:3px solid var(--foco);padding:8px 10px;border-radius:4px;margin-bottom:6px;position:sticky;top:0;z-index:2}
.rs{cursor:pointer}.rs:hover{color:var(--acc)}
main{max-width:1400px}
.mw{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}@media(max-width:900px){.mw{grid-template-columns:1fr}}
.fd{position:sticky;top:10px;max-height:calc(100vh - 30px);overflow:auto}
.fe{border:1px solid var(--acc);border-radius:8px;padding:8px 12px;margin-bottom:10px;background:var(--card2)}.fe .fl{font-weight:600}.fe .ft{display:flex;align-items:baseline;justify-content:space-between}.fe .ft b{font-size:26px}.fe.crit .ft b{color:#fbbf24}.fe.fail .ft b{color:#ef4444}.ts{display:block;text-align:right;color:var(--mut);font-size:10px}
.at{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;margin:10px 0 2px}.at small{display:block;color:var(--mut);font-size:10px}.at b{font-size:15px;color:var(--acc)}
.ba{display:grid;grid-template-columns:26px 1fr 26px;gap:6px;align-items:center}.ba button{padding:0;height:22px;line-height:1}
.bar.low{border-color:#ef4444;animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 8px #ef4444}}
.card.pl{border-top:3px solid var(--acc)}.card.pl .top button{align-self:flex-start;padding:4px 10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.dc{text-align:center;color:#fff}.dl{font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;color:#ddd}
.rollr{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin:8px 0}.rollr label{display:grid;gap:3px;font-size:10px;text-transform:uppercase;color:var(--mut)}.rollr input,.rollr select{width:72px}
.dies{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:90vw;margin:auto}
.die{position:relative}.die svg{width:100%;height:100%;animation:tumble .8s ease-out;filter:drop-shadow(0 0 18px #a855f7)}
.die polygon{fill:#2a1740;stroke:#a855f7;stroke-width:3}.die .in{fill:rgba(168,85,247,.22);stroke-width:1.5}
.die b{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800}
.dr{margin-top:16px;min-height:80px;display:flex;flex-direction:column;align-items:center;gap:4px}.dr span{color:#cfcfd8;font-size:15px}.dr strong{font-size:40px}.dr em{font-style:normal;font-weight:800;letter-spacing:.15em}
#ov.crit svg{filter:drop-shadow(0 0 26px #fbbf24)}#ov.crit polygon{stroke:#fbbf24}#ov.crit strong,#ov.crit em{color:#fbbf24}
#ov.fail svg{filter:drop-shadow(0 0 26px #ef4444)}#ov.fail polygon{stroke:#ef4444}#ov.fail strong,#ov.fail em{color:#ef4444}
@keyframes tumble{0%{transform:rotate(0) scale(.4);opacity:.3}70%{transform:rotate(600deg) scale(1.15);opacity:1}100%{transform:rotate(720deg) scale(1)}}
.dice button{font-weight:700;border-color:var(--acc);background:linear-gradient(180deg,var(--card2),var(--card))}.dice button:hover{background:var(--acc);color:#fff}
.rr{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px solid var(--line)}.rr span{flex:1}.rr small{color:var(--mut)}.rr b{font-size:16px;min-width:28px;text-align:right}.rr.crit b{color:#fbbf24}.rr.fail b{color:#ef4444}
.wide{grid-column:1/-1}
/* ===== Tema Terror ===== */
:root,:root:not([data-theme="dark"]),:root[data-theme="dark"]{--bg:#08070b;--card:#110e13;--card2:#1a141a;--line:#31232b;--tx:#e8dcc8;--mut:#a09080;--acc:#8b6bc4;--vida:#a3141b;--san:#7c3aed;--foco:#d9891a;--hf:'Cinzel','Trajan Pro',Georgia,serif}
::selection{background:#4a3a72;color:#fff}
body{font:16px/1.4 'Crimson Pro',Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at top,#1f1015 0%,#08070b 65%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:39;opacity:.09;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.72) 100%)}
header{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#4a3a72,transparent) 1;background:linear-gradient(180deg,rgba(70,55,110,.25),transparent)}
h1,h2,.ah,.lb,.dl,.nm,.fe .fl{font-family:var(--hf)}
h1{font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#d9cbb2;text-shadow:0 0 12px rgba(155,127,209,.7);animation:flick 7s infinite}
h1::before{content:"☠ ";color:var(--acc)}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.55}92%{opacity:1}95%{opacity:.75}96%{opacity:1}}
h2{color:var(--acc);letter-spacing:.14em;font-size:13px;padding-bottom:6px;border-bottom:1px solid;border-image:linear-gradient(90deg,#4a3a72,transparent) 1;text-shadow:0 0 8px rgba(155,127,209,.35)}
.card{background:linear-gradient(180deg,#151117,#0e0b10);border:1px solid var(--line);border-radius:4px;box-shadow:inset 0 0 40px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.5);position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#5b4a8a,transparent)}
.login{border:1px solid #4a3a72;box-shadow:0 0 40px rgba(120,90,170,.35),inset 0 0 40px rgba(0,0,0,.7);background:linear-gradient(180deg,#151117,#0c090d);border-radius:4px}
button{background:#161015;border:1px solid #3d2f5c;border-radius:3px;font-family:var(--hf);font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:.15s}
button:hover{border-color:var(--acc);box-shadow:0 0 12px rgba(155,127,209,.55);color:#fff}
button.p{background:linear-gradient(180deg,#7a5cb0,#2f2450);border-color:#8b6bc4;color:#fff}
input,select{background:#0a070b;border:1px solid #31232b;border-radius:3px;box-shadow:inset 0 1px 6px rgba(0,0,0,.7);color:var(--tx)}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 10px rgba(155,127,209,.5),inset 0 1px 6px rgba(0,0,0,.7)}
.av{border:1px solid #4a3a72;border-radius:3px;color:var(--acc);box-shadow:0 0 12px rgba(120,90,170,.45),inset 0 0 12px rgba(0,0,0,.8)}
.bar{background:#060408;border:1px solid #33293f;border-radius:2px;box-shadow:inset 0 0 8px #000}
.bar i{box-shadow:inset 0 -7px 9px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.12)}
.bar span{text-shadow:0 1px 3px #000;font-weight:600}
.lb,.st small,.at small,.bx small,.rollr label{letter-spacing:.14em}
.ah{background:linear-gradient(90deg,rgba(90,70,130,.5),transparent);border-left:3px solid #7a5cb0;font-size:12px;letter-spacing:.14em}
.sk{border-bottom:1px solid #24181f}.rs:hover{color:#c9b3ff;text-shadow:0 0 8px rgba(155,127,209,.6)}
.at b,.gh input{color:#9b7fd1}
.fe{border:1px solid #4a3a72;background:linear-gradient(180deg,#1a1218,#110b10);box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.rl{background:#0f0b10;border-left:3px solid #d9891a}
.pill{background:#1a141a;border:1px solid #31232b;color:var(--mut)}
.dice button{border-color:#3d2f5c;background:linear-gradient(180deg,#1d151b,#120d12)}.dice button:hover{background:#4a3a72}
#ov{background:radial-gradient(ellipse at center,rgba(40,30,70,.8),rgba(0,0,0,.92));backdrop-filter:blur(4px)}
.die svg{filter:drop-shadow(0 0 20px #7a5cb0)}.die polygon{fill:#1d0a0f;stroke:#7f62b8}.die .in{fill:rgba(120,90,170,.2)}
.dl{color:#d9cbb2;letter-spacing:.2em}.dr strong{font-family:var(--hf)}
.card.pl{border-top:1px solid var(--line)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#08070b}::-webkit-scrollbar-thumb{background:#3a2f5a;border-radius:5px}
/* ===== Mais escuro + monstro ===== */
:root,:root:not([data-theme="dark"]),:root[data-theme="dark"]{--bg:#040405;--card:#09080d;--card2:#100e17;--line:#251c29;--tx:#d9cfc0;--mut:#8a7d78;--acc:#9b7fd1}
body{background:radial-gradient(ellipse at 50% 115%,rgba(40,70,74,.2),transparent 60%),radial-gradient(ellipse at top,#100a14 0%,#040405 70%) fixed}
body::after{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.88) 100%)}
header{background:linear-gradient(180deg,rgba(50,40,80,.2),transparent)}
.card{background:linear-gradient(180deg,#0c0a10,#07050a);border-color:#251c29;box-shadow:inset 0 0 40px rgba(0,0,0,.8),0 6px 18px rgba(0,0,0,.7)}
.login{background:linear-gradient(180deg,#0c0a10,#060409);border-color:#5e0d12}
input,select{background:#040308;border-color:#251c29}
.fe{background:linear-gradient(180deg,#0f0a10,#08060b)}.rl{background:#09070c}
.dice button{background:linear-gradient(180deg,#130e14,#0a070c)}
.bar{background:#030206}
.home{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,64px);flex-wrap:wrap;min-height:80vh}
.home .login{margin:0;width:100%;max-width:340px}
.mon{position:relative;width:min(300px,70vw);aspect-ratio:236/421;
-webkit-mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 70% 72% at 50% 50%,#000 55%,transparent 100%);
filter:saturate(1.1) contrast(1.1) brightness(.9) drop-shadow(0 0 24px rgba(90,70,140,.5));animation:sway 7s ease-in-out infinite}
.mon::after{content:"";position:absolute;left:58%;top:0;width:26%;height:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,40,40,.6),transparent 70%);mix-blend-mode:screen;animation:eye 3s ease-in-out infinite}
@keyframes eye{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.home{position:relative}
.home::before{content:"";position:fixed;inset:-40px;z-index:-1;background:var(--mon) center/cover;filter:blur(28px) brightness(.85) saturate(1.1)}
.mon{background:var(--mon) center/cover;-webkit-mask-image:radial-gradient(ellipse 78% 80% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 78% 80% at 50% 50%,#000 60%,transparent 100%);filter:none;filter:drop-shadow(0 0 22px rgba(90,70,140,.45))}
body::after{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.mon{background:var(--cut) center/contain no-repeat;aspect-ratio:400/718;width:min(290px,66vw);-webkit-mask-image:none;mask-image:none;filter:drop-shadow(0 0 22px rgba(90,70,140,.5))}

.home::before{inset:-40px;z-index:-2;background:var(--bgimg) center/cover;filter:blur(26px) brightness(.5) saturate(1.1)}
.home::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg) center top/auto 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}

/* ===== Layout da ficha (referência) ===== */
.hdr{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(180deg,#0e0a0b,#080506);border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-bottom:16px}
.hdr .av{width:64px;height:64px;font-size:28px}
.hf{flex:1;min-width:150px}.hf small,.fld small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:3px;font-family:var(--hf)}
.hdr input{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;font-size:17px;padding:4px 2px}
.hdr input:focus{border-bottom-color:var(--acc);box-shadow:none}
.fld{margin:8px 0}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.bx input{font-size:20px;font-weight:700;padding:8px 2px}
.bx.df{border:1px solid var(--acc);border-radius:4px 4px 16px 16px;padding:4px 4px 0;background:rgba(0,0,0,.35)}.bx.df small::before{content:"⛨ ";color:var(--acc)}
.bx.df input{border:0;background:transparent;box-shadow:none}
.sh .bar{height:28px;margin-top:2px}.sh .bar span{line-height:28px;font-size:15px;letter-spacing:.05em}
.sh .lb{font-family:var(--hf);letter-spacing:.2em}
.perc h2{text-align:center}
.perc .sk{padding:2px 4px}.perc .sk input{padding:3px;font-size:14px}
.sk span.rs{color:var(--mut)}.sk.tr span.rs{color:#c9b3ff;font-weight:600}.sk.tr input{border-color:var(--acc)}
.perc .ah{margin:10px 0 2px;border-left:0;border-top:1px solid var(--acc);border-radius:0;background:linear-gradient(180deg,rgba(90,70,140,.28),transparent)}

.home::after{background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.55)),var(--bgimg) 42% center/cover no-repeat;-webkit-mask-image:none;mask-image:none}
.home{justify-content:flex-end;padding-right:clamp(16px,6vw,96px)}
@media(max-width:760px){.home{justify-content:center;align-items:flex-end;padding:0 0 6vh}}

<header><h1 id="ttl">Fichas de RPG</h1><div><span id="conn" class="pill"></span> <button id="out" hidden>Sair</button></div></header>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const PW=i=>i==='M'?'mestre':'jogador'+i;
const PIN=i=>i==='M'?'0000':(i==='10'?'1010':String(i).repeat(4));
const G=[['Força',4,['Combate Corpo a Corpo','Arremesso','Armas de Fogo','Acrobacia']],
['Vigor',2,['Sorte -','Constituição']],
['Intelecto',9,['Investigação','Intuição','Medicina','Sobrevivência','Tecnologia','História','Forja','Arrombamento','Direção']],
['Agilidade',5,['Mãos Leves','Reflexo','Atletismo','Furtividade','Pontaria']],
['Presença',5,['Percepção','Intimidação','Performance','Escutar','Enganação']]];
const DEF={foto:'',player:'',nome:'',vida:10,vidaMax:10,foco:10,focoMax:10,sanidade:10,sanidadeMax:10,defesa:10,iniciativa:0,fome:0,sede:0,grau:'',salv:'',dogma:'',pesoMax:'',i1:'',i2:'',i3:''};
G.forEach((g,gi)=>{DEF['A'+gi]=1;g[2].forEach((_,si)=>DEF['s'+gi+'_'+si]=0)});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- store: Firebase Firestore (tempo real). Sem configuração => modo local
const FIREBASE_CONFIG={apiKey:"AIzaSyBqiia5QxOjGVB1w0w2l8Uh9foFn3KS160",authDomain:"fichas-rpg-855b4.firebaseapp.com",projectId:"fichas-rpg-855b4"};
let fs=null,mem={},memL=[],off=[];
try{if(!FIREBASE_CONFIG.apiKey.startsWith('COLE')){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore()}}catch(e){console.error(e)}
const store={
 sub(id,cb){ if(fs)return fs.doc('fichas/'+id).onSnapshot(s=>cb(s.data()||{}),e=>console.error(e));
  const f=()=>cb(mem[id]||{});memL.push(f);f();return()=>memL=memL.filter(x=>x!==f)},
 subAll(cb){ if(fs)return fs.collection('fichas').onSnapshot(q=>{const o={};q.forEach(d=>o[d.id]=d.data());cb(o)},e=>console.error(e));
  const f=()=>cb(mem);memL.push(f);f();return()=>memL=memL.filter(x=>x!==f)},
 upd(id,o){ if(fs)return fs.doc('fichas/'+id).set(o,{merge:true}).catch(()=>{$('#conn').textContent='⚠ erro ao salvar'});
  mem[id]={...(mem[id]||{}),...o};memL.forEach(f=>f())}
};
const clear=()=>{off.forEach(f=>f());off=[]};
$('#conn').textContent=fs?'● tempo real':'modo local (configure o Firebase)';$('#conn').style.color=fs?'#4caf50':'#f59e0b';

// ---- login
function login(){clear();$('#ttl').textContent='Fichas de RPG';$('#out').hidden=true;
 let o='';for(let i=1;i<=10;i++)o+=`<option value="${i}">Ficha ${i}</option>`;o+='<option value="M">Página 11 — Mestre</option>';
 app.innerHTML=`<div class="home"><div class="login"><h1>Entrar</h1><select id="pg">${o}</select><input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Senha ou PIN" inputmode="numeric" style="-webkit-text-security:disc"><div class="kp">${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>`<button type="button" data-kp="${k}">${k}</button>`).join('')}</div><div class="err" id="er"></div><button class="p" id="go">Entrar</button></div></div>`;
 const go=()=>{const id=$('#pg').value;const v=$('#pw').value.trim().toLowerCase();if(v===PW(id)||v===PIN(id)){id==='M'?master():sheet(id,false)}else $('#er').textContent='Senha incorreta'};
 document.querySelectorAll('[data-kp]').forEach(b=>b.onclick=()=>{const p=$('#pw'),k=b.dataset.kp;p.value=k==='C'?'':k==='⌫'?p.value.slice(0,-1):p.value+k});
 $('#go').onclick=go;$('#pw').onkeydown=e=>e.key==='Enter'&&go();setTimeout(()=>$('#pw').focus(),50);
}
$('#out').onclick=login;

// ---- barras e cartões
const bar=(cur,max,c)=>{const p=max>0?Math.max(0,Math.min(100,cur/max*100)):0;return`<div class="bar${p<=25&&max>0?' low':''}"><i style="width:${p}%;background:${c}"></i><span>${cur} / ${max}</span></div>`};
const V=(d,k)=>d[k]??DEF[k];

let cache={};
const fmt=e=>{const r=e.rs||[e.r];return `[${r.join(', ')}]`+(e.b?` ${e.b>0?'+':'−'} ${Math.abs(e.b)}`:'')};
function master(){clear();$('#ttl').textContent='Mesa do Mestre';$('#out').hidden=false;
 app.innerHTML='<div class="mw"><aside class="card fd"><h2>Resultados</h2><div id="fd"></div></aside><div class="grid" id="g"></div></div>';
 const g=$('#g');
 g.onclick=e=>{const b=e.target.closest('[data-a]');
  if(b){const[i,k,dl]=b.dataset.a.split('|'),d=cache['p'+i]||{};store.upd('p'+i,{[k]:Math.max(0,Math.min(V(d,k+'Max'),V(d,k)+Number(dl)))});return}
  const o=e.target.closest('[data-id]');if(o)sheet(o.dataset.id,true)};
 off.push(store.subAll(all=>{cache=all;let h='',R=[];
  for(let i=1;i<=10;i++){const d=all['p'+i]||{};(d.rolls||[]).forEach(e=>R.push(e));
   const br=(l,k,c)=>`<div class="lb">${l}</div><div class="ba"><button data-a="${i}|${k}|-1">−</button>${bar(V(d,k),V(d,k+'Max'),c)}<button data-a="${i}|${k}|1">+</button></div>`;
   const f=V(d,'foto'),last=(d.rolls||[])[0];
   h+=`<div class="card pl"><div class="top"><div class="av" style="${f?`background:url(${f}) center/cover`:''}">${f?'':esc((V(d,'nome')||'?')[0])}</div><div style="flex:1"><div class="nm">${esc(V(d,'nome')||'Ficha '+i)}</div><div class="sub">${esc(V(d,'player')||'Jogador '+i)}</div><div class="sub">${esc(V(d,'grau')||'—')}</div></div><button data-id="${i}">Ficha</button></div>
   <div class="at">${G.map((x,j)=>`<div><small>${AB[j]}</small><b>${Math.min(5,Number(V(d,'A'+j))||0)}</b></div>`).join('')}</div>
   ${br('Vida','vida','var(--vida)')}${br('Sanidade','sanidade','var(--san)')}${br('Foco','foco','var(--foco)')}
   <div class="st"><div><small>Def</small><b>${V(d,'defesa')}</b></div><div><small>Ini</small><b>${V(d,'iniciativa')}</b></div><div><small>Fome</small><b>${V(d,'fome')}</b></div><div><small>Sede</small><b>${V(d,'sede')}</b></div><div><small>Inv</small><b>${[1,2,3].filter(n=>V(d,'i'+n)).length}/3</b></div></div>
   ${last?`<div class="sub" style="margin-top:8px">🎲 ${esc(last.l)}: <b>${last.t}</b></div>`:''}</div>`}
  g.innerHTML=h;R.sort((a,b)=>b.ts-a.ts);
  $('#fd').innerHTML=R.slice(0,12).map(e=>`<div class="fe ${e.k||''}"><small>${esc(e.n)}</small><div class="fl">${esc(e.l)}</div><div class="ft"><b>${e.t}</b><small>${fmt(e)}</small></div><small class="ts">${new Date(e.ts).toLocaleTimeString('pt-BR')}</small></div>`).join('')||'<span class="sub">Nenhuma rolagem ainda</span>'}));
}

// ---- ficha editável
const AB=['FOR','VIG','INT','AGI','PRE'];
function radar(st){const cx=180,cy=175,R=100,I=[0,1,2,3,4],pt=(i,v)=>{const a=(-90+72*i)*Math.PI/180;return[cx+R*v/5*Math.cos(a),cy+R*v/5*Math.sin(a)]};
 const val=I.map(i=>Math.max(0,Math.min(5,Number(st['A'+i])||0)));
 let s='<svg viewBox="0 0 360 330" class="rad">';
 for(let l=5;l>=1;l--)s+=`<polygon points="${I.map(i=>pt(i,l).join(',')).join(' ')}" fill="${l==5?'rgba(0,0,0,.35)':'none'}" stroke="var(--line)" stroke-width="${l==5?2:1}"/>`;
 I.forEach(i=>{const[x,y]=pt(i,5);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
 s+=`<polygon points="${val.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="rgba(155,127,209,.5)" stroke="#9b7fd1" stroke-width="2.5"/>`;
 I.forEach(i=>{for(let l=1;l<=5;l++){const[x,y]=pt(i,l),on=l<=val[i];
  s+=`<circle cx="${x}" cy="${y}" r="${on?4.5:2.5}" fill="${on?'#9b7fd1':'var(--mut)'}"/><circle class="hit" data-a="${i}" data-l="${l}" cx="${x}" cy="${y}" r="11" fill="transparent" style="cursor:pointer"/>`}});
 I.forEach(i=>{const[nx,ny]=pt(i,6.75),[ex,ey]=pt(i,5);
  s+=`<line x1="${ex}" y1="${ey}" x2="${nx}" y2="${ny}" stroke="var(--acc)" stroke-opacity=".6" stroke-width="2"/><circle cx="${nx}" cy="${ny}" r="26" fill="#0a0910" stroke="var(--acc)" stroke-width="2"/><circle cx="${nx}" cy="${ny}" r="21" fill="none" stroke="var(--line)"/>
  <text x="${nx}" y="${ny-5}" text-anchor="middle" fill="var(--mut)" font-size="10" letter-spacing="1">${AB[i]}</text><text x="${nx}" y="${ny+15}" text-anchor="middle" fill="var(--tx)" font-size="21" font-weight="700">${val[i]}</text><title>${G[i][0]}</title>`});
 return s+'</svg>'}

function sheet(n,isM){clear();const id='p'+n;$('#out').hidden=false;$('#ttl').textContent='Ficha '+n;
 const num=k=>`<input type="number" data-k="${k}">`,txt=k=>`<input data-k="${k}">`;
 const pair=(l,k)=>`<div class="lb" style="text-align:left">${l}</div><div id="b_${k}"></div><div class="row2"><span class="sub">Atual / Máx</span>${num(k)}${num(k+'Max')}</div>`;
 const box=(l,k,c)=>`<div class="bx${c?' df':''}"><small>${l}</small>${num(k)}</div>`;
 let h=(isM?'<button id="bk" style="margin-bottom:14px">← Voltar à mesa</button>':'')+'';
 h+=`<div class="hdr"><label class="av" id="av" title="Trocar foto">☾<input type="file" accept="image/*" id="ph" hidden></label>
  <div class="hf"><small>Personagem</small>${txt('nome')}</div><div class="hf"><small>Jogador</small>${txt('player')}</div><div class="hf"><small>Grau amaldiçoado</small>${txt('grau')}</div>
  <div class="hf" style="flex:0 0 auto"><small>Foto: JPG, PNG ou GIF (até 300 KB)</small><button id="rm" hidden>✕ Remover foto</button></div></div>
  <div class="sh"><div class="col">
  <div class="card"><h2 style="text-align:center">Atributos</h2><div class="sub" style="text-align:center">máx. 5 — toque nos pontos para alterar</div><div id="radar"></div></div>
  <div class="card"><div class="info">${box('Defesa','defesa',1)}${box('Iniciativa','iniciativa')}${box('Fome','fome')}${box('Sede','sede')}</div>${pair('Vida','vida')}${pair('Sanidade','sanidade')}${pair('Foco','foco')}</div>
  <div class="card"><h2>Ocultismo</h2><div class="fld"><small>Salvaguarda</small>${txt('salv')}</div><div class="fld"><small>Dogma</small>${txt('dogma')}</div></div>
  <div class="card"><div class="gh"><h2>Inventário <span id="ic" class="pill"></span></h2></div><div class="fld"><small>Peso Máx.</small>${txt('pesoMax')}</div>${[1,2,3].map(x=>`<div class="inv"><b>${x}</b>${txt('i'+x)}</div>`).join('')}</div></div>`;
 h+='<div class="card perc"><h2>Perícias</h2><div class="sub" style="text-align:center">clique no nome da perícia: d20 + valor + bônus</div><div class="rollr"><label>Qtd<input type="number" id="dq" min="1" max="20" value="1"></label><label>Dado<select id="dd">'+[4,6,8,10,12,20,100].map(d=>`<option${d==20?' selected':''}>${d}</option>`).join('')+'</select></label><label>Bônus<input type="number" id="db" value="0"></label><button class="p" id="dgo">Rolar</button></div><div class="sub">O bônus também vale para as perícias.</div><div class="dice">'+[4,6,8,10,12,20,100].map(d=>`<button data-d="${d}">d${d}</button>`).join('')+'</div><div id="rl" class="rl"><span class="sub">Nenhuma rolagem ainda</span></div>'+G.map((g,gi)=>`<div class="ah"><span>${g[0]}</span><span id="ah${gi}"></span></div>`+g[2].map((s,si)=>`<div class="sk"><span class="rs" data-gi="${gi}" data-si="${si}">${s}</span><em>${AB[gi]}</em>${num('s'+gi+'_'+si)}</div>`).join('')).join('')+'</div></div>';
 app.innerHTML=h;
 if(isM)$('#bk').onclick=master;
 let st={...DEF};
 const drawR=()=>{$('#radar').innerHTML=radar(st);G.forEach((g,gi)=>$('#ah'+gi).textContent='('+Math.min(5,Number(st['A'+gi])||0)+')')};
 $('#radar').onclick=e=>{const p=e.target.closest('.hit');if(!p)return;const i=+p.dataset.a,l=+p.dataset.l,k='A'+i,c=Math.min(5,Number(st[k])||0),v=c===l?l-1:l;st[k]=v;store.upd(id,{[k]:v});drawR()};
const showRoll=e=>{$('#ov')?.remove();const o=document.createElement('div');o.id='ov';const rs=e.rs||[e.r];const sz=rs.length==1?180:rs.length<=4?100:64;
 o.innerHTML=`<div class="dc"><div class="dl">${esc(e.l)}</div><div class="dies">${rs.map(()=>`<div class="die" style="width:${sz}px;height:${sz}px"><svg viewBox="0 0 100 100"><polygon points="50,4 92,28 92,72 50,96 8,72 8,28"/><polygon class="in" points="50,4 92,72 8,72"/><polygon class="in" points="50,96 92,28 8,28"/></svg><b style="font-size:${Math.round(sz*.31)}px">?</b></div>`).join('')}</div><div class="dr"></div></div>`;
 document.body.appendChild(o);o.onclick=()=>o.remove();
 const bs=o.querySelectorAll('.die b'),dr=o.querySelector('.dr'),iv=setInterval(()=>bs.forEach(b=>b.textContent=1+Math.floor(Math.random()*e.d)),60);
 setTimeout(()=>{clearInterval(iv);bs.forEach((b,i)=>b.textContent=rs[i]);o.classList.add(e.k||'ok');
  dr.innerHTML=(rs.length>1||e.b?`<span>${fmt(e)}</span>`:'')+`<strong>${e.t}</strong>`+(e.k=='crit'?'<em>CRÍTICO!</em>':e.k=='fail'?'<em>FALHA CRÍTICA</em>':'')},800);
 setTimeout(()=>o.remove(),5000)};
const roll=(l,d,c,b)=>{const rs=Array.from({length:c},()=>1+Math.floor(Math.random()*d)),sum=rs.reduce((a,x)=>a+x,0),k=d===20&&c===1?(rs[0]===20?'crit':rs[0]===1?'fail':''):'';
 const e={n:st.nome||'Ficha '+n,l,d,rs,b,t:sum+b,k,ts:Date.now()};st.rolls=[e,...(st.rolls||[])].slice(0,8);store.upd(id,{rolls:st.rolls});showRoll(e);renderRl()};
 const renderRl=()=>{$('#rl').innerHTML=(st.rolls||[]).length?st.rolls.slice(0,5).map(e=>`<div class="rr ${e.k||''}"><span>${esc(e.l)}</span><small>${fmt(e)}</small><b>${e.t}</b></div>`).join(''):'<span class="sub">Nenhuma rolagem ainda</span>'};
 const qt=()=>Math.max(1,Math.min(20,Math.floor(+$('#dq').value)||1)),bn=()=>Number($('#db').value)||0,lb=(c,d,b)=>`${c}d${d}${b?(b>0?'+':'−')+Math.abs(b):''}`;
 $('#dgo').onclick=()=>{const d=+$('#dd').value,c=qt(),b=bn();roll(lb(c,d,b),d,c,b)};
 app.querySelectorAll('.dice button').forEach(x=>x.onclick=()=>{const d=+x.dataset.d,c=qt(),b=bn();$('#dd').value=d;roll(lb(c,d,b),d,c,b)});
 app.querySelectorAll('.rs').forEach(el=>el.onclick=()=>roll(el.textContent,20,1,(Number(app.querySelector(`[data-k="s${el.dataset.gi}_${el.dataset.si}"]`).value)||0)+bn()));
 
const setAv=()=>{const a=$('#av');a.style.background=st.foto?`url(${st.foto}) center/cover`:'';a.style.color=st.foto?'transparent':'';$('#rm').hidden=!st.foto};
 $('#ph').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const save=u=>{st.foto=u;setAv();store.upd(id,{foto:u})};
 if(f.type==='image/gif'){if(f.size>300*1024){alert('GIF muito grande. Use um GIF de até 300 KB.');return}const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(f);return}
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);save(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)};
 $('#rm').onclick=()=>{st.foto='';setAv();store.upd(id,{foto:''})};
 const t={};
 app.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{const k=el.dataset.k;
  const v=el.type==='number'?(el.value===''?0:Number(el.value)):el.value;clearTimeout(t[k]);t[k]=setTimeout(()=>store.upd(id,{[k]:v}),400);
  if(el.type==='number'&&/^(vida|foco|sanidade|s\d)/.test(k))paint()});
 const paint=()=>{app.querySelectorAll('.sk').forEach(r=>r.classList.toggle('tr',Number(r.querySelector('input').value)>0));const g=k=>Number(app.querySelector(`[data-k="${k}"]`).value)||0;
  [['vida','var(--vida)'],['foco','var(--foco)'],['sanidade','var(--san)']].forEach(([k,c])=>$('#b_'+k).innerHTML=bar(g(k),g(k+'Max'),c));
  $('#ic').textContent=[1,2,3].filter(x=>app.querySelector(`[data-k="i${x}"]`).value).length+' / 3'};
 off.push(store.sub(id,d=>{st={...DEF,...d};app.querySelectorAll('[data-k]').forEach(el=>{if(el!==document.activeElement)el.value=V(d,el.dataset.k)});paint();drawR();setAv();renderRl()}));
}
login();
</script></body></html>
